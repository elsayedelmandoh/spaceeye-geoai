# spaceeye real-data pipeline (R1): paths, thresholds, seed.
# data lives outside the repo; sources are audited files and are never modified.
seed: 2026
computed_on: "2026-10-26"        # fixed so two runs give identical outputs
asof: "2026Q3"                    # latest quarter for the cycle list
first_quarter: "2016Q1"           # quarter index 0
last_quarter: "2026Q3"

paths:
  real_data: "F:/ACUD AI Data Lab/Project/real_data"
  app_data: "F:/ACUD AI Data Lab/Project/app_data"
  private: "F:/ACUD AI Data Lab/Project/private"

# source files, relative to paths.real_data
sources:
  facts: "26_data_audit/facts"
  boundaries: "26_data_audit/locations_v2/compound_boundaries_v3.geojson"
  boundaries_added: "26_data_audit/locations_v3/boundaries_added.geojson"
  decree: "26_data_audit/reference/decree_2184_canonical.csv"
  macro: "26_data_audit/reference/macro_monthly_2023_2026.csv"
  weather: "26_data_audit/reference/weather_monthly_2023_2026.csv"
  veg_fixed: "26_data_audit/satellite/s2_plot_yearly_2019_2026_FIXED.csv"
  plot_labels: "26_data_audit/satellite/radar_vs_obt_plot_years_ee.csv"
  plot_to_compound: "26_data_audit/locations/dw_polygon_to_compound.csv"
  dw_polygons: "17_builtup_2024_2026_options/dynamic_world_polygons_quarterly.csv"
  dw_compounds: "28_team_ideas_tests/features/cache/dw_compounds_quarterly.csv"
  s4_windows_glob: "28_team_ideas_tests/features/cache/s4_windows_*.csv"
  s4_windows_quarterly_glob: "30_district_retrospective/cache/w_*.csv"   # 12-month windows ending every quarter 2017Q4-2026Q3, 225 plots (audited recipe)
  osm_polygons: "05_geo_satellite/raw/osm_polygons_all_bbox.geojson"
  plot_split: "28_team_ideas_tests/features/split_plots_seed2026.csv"
  # a v6 file (29_height_final/v6/compound_height_yearly.csv) may replace this one later;
  # rows are kept when `published` is true, or (no such column) when year <= heights_max_year
  heights: "27_height_embedding/v4_builtmask/compound_height_2016_2025_builtmask.csv"

heights_max_year: 2024

# indicators
k1_active: 0.02            # dynamic world 12-month change that counts as growth
n_images_min: 6            # K4: dynamic world images in the quarter
veg_complete: 0.10         # vegetation share that suggests "may be complete"
activity_features_cap: 6   # quarters looked back for persistence features

# a compound has started when A shows 4 consecutive active quarters or a launch / delivery event is published; K2 counts only after that
start:
  run_quarters: 4
  events: [launch, delivery_start, delivery_progress, delivery_complete]

# activity score A: windows ending every quarter, training windows end 2019Q1-2023Q4, label = OBT label of the plot-year whose 30 June is inside the window
activity:
  train_first_quarter: "2019Q1"
  train_last_quarter: "2023Q4"
  holdout_label_year: 2022          # T1/T2: train label year <= 2021 (windows ending <= 2021Q4), test label year >= 2022
  eval_first_quarter: "2024Q1"      # T3 and the seasonal-spread test: windows ending 2024Q1 .. 2025Q4 on OBT-stable plots
  eval_last_quarter: "2025Q4"
  min_gain_ba: 3.0                  # T1, T2: A >= K1 + 3 balanced-accuracy points
  max_false_alarm_extra: 5.0        # T3: A active share <= K1 active share + 5 points
  max_seasonal_spread: 10.0         # points between the highest and lowest quarter-of-year active share on stable plots
  overlap_exclude: 0.5              # backtest variant drops training plots covering this share of any compound

levels:
  k2_l1: 4
  k2_l2: 2                 # 2-3 -> level 2, 1 -> level 3
  k3_l1: 24
  k3_l2: 13                # 13-24 -> level 2, 1-12 -> level 3
  combo_k2: 2
  combo_k3: 12
cycle_capacity: 8

# backtest criterion (fixed on 2026-10-26 before any computation)
backtest:
  min_cases: 5
  months_before: 6
  levels: [1, 2]
  first_quarter: "2019Q1"

# compound table: generated fields (orange) and rules
compounds:
  coverage: 0.225
  floors: 8                # ground + 7
  far_cap: 1.8
  unit_m2: [120, 170]
  feddan_m2: 4200.83
  cover_class: {limited: 0.20, small: 0.15}   # <50 / 50-<100 feddan, decree 2184

drivers:
  shock_fx_mom: 0.05       # month-on-month dollar rise that marks a shock month
  # ramadan and eid ranges (calendar, +-1 day)
  ramadan: [["2023-03-23", "2023-04-20"], ["2024-03-11", "2024-04-09"], ["2025-03-01", "2025-03-29"], ["2026-02-18", "2026-03-19"]]
  eid: [["2023-04-21", "2023-04-23"], ["2023-06-28", "2023-07-01"], ["2024-04-10", "2024-04-12"], ["2024-06-16", "2024-06-19"],
        ["2025-03-30", "2025-04-01"], ["2025-06-06", "2025-06-09"], ["2026-03-20", "2026-03-22"], ["2026-05-27", "2026-05-30"]]

# ---- generator (R2): synthetic tables. seed is the top-level `seed` above. -------------------------------------------------------------------
generator:
  label: "Synthetic - for training only"
  warmup_start: "2017-01"          # simulated from here, only 2023-01 onwards is written
  start: "2023-01"
  end: "2026-09"
  float_month: "2024-03"           # the 6 March 2024 float
  # calendar before the real drivers start (+-1 day, public calendar). 2023+ ranges are in `drivers` above.
  ramadan_pre2023: [["2017-05-27", "2017-06-24"], ["2018-05-16", "2018-06-14"], ["2019-05-06", "2019-06-03"], ["2020-04-24", "2020-05-23"],
                    ["2021-04-13", "2021-05-12"], ["2022-04-02", "2022-05-01"]]
  eid_pre2023: [["2017-06-25", "2017-06-27"], ["2018-06-15", "2018-06-17"], ["2019-06-04", "2019-06-06"], ["2020-05-24", "2020-05-26"],
                ["2021-05-13", "2021-05-15"], ["2022-05-02", "2022-05-04"]]
  stories:
    state_window: 3                # quarters, majority vote over A to remove one-quarter flicker
    stall_quarters: 4              # trailing inactive quarters that make a gradual stall
    recovery_gap_quarters: 3       # inactive run that, followed by activity, makes a stall-and-recovery
    new_start_from: "2024Q3"       # first sustained activity at or after this quarter, nothing before: new project
    dw_cap: 95                     # the satellite level never maps above this progress (finishing is invisible to it)
    phase_share: [0.35, 0.50]      # share of the project a phase-1 handover covers
  plan:
    duration_months: [30, 42]
    weibull_shape: [2.0, 3.0]
    weibull_scale: 0.55
    launch_to_start_months: [3, 9]
  progress:
    ar1: {rho: 0.5, sigma: 0.15}
    season: {ramadan: -0.20, jul_aug: -0.10, eid_week: -0.30}
    inactive_weight: 0.05
  cost:
    usd_m2: [720, 1270]
    imported_share: 0.40
  sales:
    margin: [1.4, 2.0]
    down_payment: 0.085
    installment_years: [7, 12]
    hazard_launch: 0.16
    hazard_decay_months: 10.0
    hazard_tail: 0.010
    saleable_share: [0.88, 1.0]
    boom_factor: [1.4, 1.8]
    boom_months: [2, 4]            # months after the float
    price_jump: [0.15, 0.40]
    price_jump_lag: [1, 3]
    price_drift_month: 0.005
    late_rate: 0.03
    late_rate_after_float: 0.08
    rate_sensitivity: 0.012        # demand falls this much (log) per policy-rate point above 16.25
  escrow:
    release_advance: 0.05
    refund_reserve: 0.05           # decree 2184 art 3(6)
  funding:                         # equity at launch (share of total cost); bank line = adequacy x the peak borrowing the compound would need
    strong: {equity: 0.16, adequacy: 1.5}
    medium: {equity: 0.11, adequacy: 1.2}
    weak: {equity: 0.07, adequacy: 0.9}
    story_adequacy: {healthy: 1.0, slow_late: 1.0, partly_delivered: 1.0, new_start: 1.0, stall_recovery: 0.5, gradual_stall: 0.45}
    strength_shares: [0.30, 0.50, 0.20]
    overhead_year: 0.012
    credit_spread_pct: 4.0
  land:
    price_m2: [2500, 12000]
    installments: 16
    handover_after_launch_months: [3, 12]
    penalty_month: 0.01
  reports:
    lag_days: [15, 45]
    late_extra_days: [15, 30]
    optimism_points: [2, 8]
    optimism_stall_extra: 1.5
    accurate_sd: 1.0
    round5_share: 0.20
    missing_normal: 0.05
    missing_stall: 0.35
    styles: {accurate: 0.4, optimistic: 0.4, late: 0.2}
  utilities:
    kwh_per_unit: 153
    kwh_sd: 0.08
    standby_kwh: 12
    site_kwh_per_m2: 25
    site_base_kwh: [8000, 25000]
    estimated_share: 0.04
    occupancy_cap: [0.25, 0.70]
    occupancy_delay: [2, 6]
    occupancy_scale_months: 6
    seasonal_slope: 0.55           # seasonal factor = a + slope * (tmax - 19.5) / 18.5, normalised to a yearly mean of 1
  complaints:
    base_per_1000_units_month: 1.3
    dispersion: 5.0
    event_multiplier: [2.0, 5.0]
    event_months: 3
    wrong_category: 0.125
    duplicate_share: 0.05
    channels: {phone: 0.50, portal: 0.35, visit: 0.15}
    n_texts: 100
    viral_multiplier: [3.0, 6.0]
  warnings:
    grace_months: 12
    stall_months: 3
    repeat_months: 6
    review_months: [1, 4, 7, 10]   # reviews run in the month after each quarter end
  defects:
    escrow_thousand_months: 4
    duplicate_report_share: 0.01
    early_report_date_rows: 5
    unknown_code: "C99"
    unknown_code_rows: 15
    before_launch_rows: 5
    phone_texts: 10
