# spaceeye-geoai — Cost Assumptions (Layer 5 Config)
# Per docs/project-definition/08-structure.md; values are EGP (Egyptian Pound) estimates
# These are baseline assumptions for KPI calculations; confirmed cost audits must update this file.

energy:
  unit: "kwh"  # electricity consumption unit (converted from raw wh by cleaning layer)
  tariff_egp_per_kwh: 1.85  # residential tariff (Z04, Z05, Z07 residential zones)
  commercial_tariff_egp_per_kwh: 2.40  # commercial / government (Z01, Z02, Z03, Z06 zones)
  off_hours_start_hour: 18  # 18:00 (6 PM) for off-hours waste detection (K1)
  off_hours_end_hour: 8     # 08:00 next morning

water:
  unit: "m3"  # cubic meters (from `m3` column in water_meters.csv)
  tariff_egp_per_m3: 4.50  # water supply tariff per architecture spec
  night_window_start_hour: 22  # 22:00 (night flow for K3 leak index)
  night_window_end_hour: 6     # 06:00

waste:
  unit: "tonnes"  # from collection_trips.csv
  truck_trip_cost_egp: 850.0  # diesel + labor + disposal cost per trip
  truck_capacity_tonnes: 6.5    # truck capacity; efficiency ratio computed against this
  overflow_penalty_egp: 320.0  # SLA breach cost (overflow left overnight)

citizen_services:
  unit: "request"
  sla_hours_target: 72  # target resolution time (hours from created_at to closed_at)
  sla_breach_hour_cost_egp: 125.0  # estimated cost per hour of delay past SLA
