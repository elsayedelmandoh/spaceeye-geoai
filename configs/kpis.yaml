# spaceeye-geoai — KPI Registry (Layer 6 Config)
# Per docs/project-definition/08-structure.md and architecture spec
# Each card: purpose, formula, owner, thresholds, investigation steps, decision actions

kpi_cards:
  - id: K1
    name: "Off-Hours Energy Waste %"
    purpose: "Detect off-hours energy waste in government / CBD buildings (seasonal baseline, not fixed threshold)"
    formula: "(energy_consumed_off_hours / total_daily_energy) * 100; off-hours: 18:00-08:00"
    dataset: "electricity_meters.csv (cleaned kwh)"
    owner: "Energy Operations Lead"
    thresholds:
      amber: 15.0   # >= 15% off-hours consumption triggers review
      red: 25.0     # >= 25% requires immediate action (HVAC scheduling review)
    investigation_steps:
      - "Confirm off-hours window matches cost_assumptions.yaml (start: 18h, end: 8h)"
      - "Compare building-level consumption vs zone aggregate for same day type"
      - "Cross-reference calendar.csv: non-working days should have near-zero commercial load"
      - "Check building reference: B-0112 (gov), B-0240 (CBD), B-0269 (res) for anomalous night peaks"
    decision_actions:
      - "amber: schedule HVAC audit within 3 days; notify building manager"
      - "red: initiate emergency scheduling change; prepare savings scenario"

  - id: K2
    name: "Daily Peak Demand"
    purpose: "Peak hourly energy demand per zone per day; used for capacity planning"
    formula: "max(kwh) per zone per day; hourly grain from electricity_meters"
    dataset: "electricity_meters.csv (cleaned)"
    owner: "Grid Planning Analyst"
    thresholds:
      amber: 750.0   # kwh per zone
      red: 1200.0    # kwh per zone (near capacity limit)
    investigation_steps:
      - "Confirm peak time (hour) is consistent with zone type (CBD peaks midday; residential peaks evening)"
      - "Compare to calendar flags (ramadan, holidays, dust events)"
      - "Cross-check with weather reference (high temperature correlates with HVAC peak)"
    decision_actions:
      - "amber: add to next-day capacity forecast; notify operator"
      - "red: prepare load-shed plan; confirm backup generator readiness"

  - id: K3
    name: "Night Minimum Flow Leak Index"
    purpose: "Flag leaks from night-flow rise + pressure drop (water module 5-step confirmation)"
    formula: "(night_flow - baseline) / baseline where night: 22:00-06:00; confirm with `network_pressure` drop"
    dataset: "water_meters.csv + network_pressure.csv"
    owner: "Water Maintenance Engineer"
    thresholds:
      amber: 0.15   # 15% above baseline
      red: 0.35     # 35% above baseline (likely leak)
    investigation_steps:
      - "Confirm night window (cost_assumptions.yaml: 22h-06h)"
      - "Compare zone-level water_meters to zone aggregate baseline"
      - "Cross-reference network_pressure for pressure drop in same zone/hour"
      - "Check calendar: ramadan/hiday shifts expected; non-shift nights should match baseline"
    decision_actions:
      - "amber: add zone to inspection list within 48h"
      - "red: dispatch emergency inspection; prepare water-shutoff plan"

  - id: K4
    name: "Pressure Compliance %"
    purpose: "% of network_pressure readings within safe range per zone/hour"
    formula: "count(in_safe_range) / total_readings * 100"
    dataset: "network_pressure.csv"
    owner: "Network Operations Lead"
    thresholds:
      amber: 85.0   # >= 85% within range is acceptable; < 85% requires review
      red: 70.0     # < 70% indicates significant network issue
    investigation_steps:
      - "Confirm safe pressure range (architecture spec); compare zone averages"
      - "Check timeliness (C13): stale readings can show false non-compliance"
      - "Cross-reference with water_meters: low pressure + low flow suggests blockage; high pressure + high flow suggests leak"
    decision_actions:
      - "amber: schedule zone inspection; notify maintenance team"
      - "red: activate emergency pressure management protocol"

  - id: K5
    name: "Bin Overflow Rate % (Z04 + Z06)"
    purpose: "% of bins in Z04/Z06 with fill_pct > overflow threshold (per architecture: Z04 green river, Z06 residential)"
    formula: "count(fill_pct > 85) / total_bins_in_zone * 100"
    dataset: "bin_fill.csv (cleaned) + assets.csv (zone filter)"
    owner: "Waste Dispatch Manager"
    thresholds:
      amber: 20.0   # >= 20% bins near overflow
      red: 35.0     # >= 35% bins near overflow — immediate truck dispatch needed
    investigation_steps:
      - "Confirm zone filter (assets.csv zone_id) applies to Z04 and Z06"
      - "Compare to collection_trips for same day (low trips + high overflow = scheduling gap)"
      - "Check calendar: weekend/holiday differences expected"
    decision_actions:
      - "amber: adjust next-day route; add zone to priority list"
      - "red: trigger dynamic dispatch; prepare backtest scenario (trips saved vs overflow)"

  - id: K6
    name: "Collection Efficiency & Empty-Trip Ratio"
    purpose: "efficiency = tonnes_collected / truck_capacity; empty-trip ratio = empty_trips / total_trips"
    formula: "efficiency: mean(tonnes) / 6.5 (capacity); empty_trip: count(tonnes == 0 or very low) / total_trips"
    dataset: "collection_trips.csv"
    owner: "Waste Operations Lead"
    thresholds:
      amber_efficiency: 0.60  # < 60% average load means under-utilized trips
      red_efficiency: 0.40    # < 40% requires route redesign
      amber_empty: 0.10      # > 10% empty trips
      red_empty: 0.20        # > 20% empty trips
    investigation_steps:
      - "Compare trip count vs zone-level bin_fill overflow rate (K5)"
      - "Check route timing vs off-hours schedule (cost_assumptions.yaml)"
      - "Cross-reference assets.csv for zone assignment consistency"
    decision_actions:
      - "amber: review route sequence; consider merging nearby zones"
      - "red: redesign route; prepare savings scenario (trips saved)"

  - id: K7
    name: "Citizen SLA & Routing Accuracy"
    purpose: "SLA compliance (hours from created_at to closed_at vs 72h target) + Gemini triage vs keyword baseline (73% target)"
    formula: "sla_pct: mean(hours <= 72); routing_accuracy_pct: gemini_accuracy vs 30 labelled complaints"
    dataset: "service_requests.csv (cleaned)"
    owner: "Citizen Services Manager"
    thresholds:
      amber_sla: 0.75  # < 75% SLA met
      red_sla: 0.50     # < 50% SLA met — significant service gap
      amber_accuracy: 0.73  # keyword baseline target
      red_accuracy: 0.60     # accuracy below 60% requires model review
    investigation_steps:
      - "Confirm SLA target (72h) from cost_assumptions.yaml"
      - "Compare Gemini triage (structured pydantic output) vs keyword baseline"
      - "Cross-reference category mapping (canonical 6 categories) with service_requests"
      - "Check PII masking applied (C16): 0 unmasked phones/national IDs remaining"
    decision_actions:
      - "amber: review triage rules; confirm Gemini model (config: gemini-2.5-flash)"
      - "red: retrain / adjust triage model; produce shift handover brief"

  - id: K8
    name: "Data Trust Score"
    purpose: "composite: (checks_passed / total_checks + coverage_pct + freshness_pct) / 3"
    formula: "k8 = mean(C06..C16 pass rate, dataset coverage, timestamp freshness)"
    dataset: "composite — all cleaned_* tables + raw_* tables + reference"
    owner: "Data Governance Officer"
    thresholds:
      amber: 70.0  # trust score < 70% requires audit review
      red: 50.0     # trust score < 50% — pipeline halted until fixes applied
    investigation_steps:
      - "Review individual check results (C06-C16) for failing dimensions"
      - "Confirm cleaned_* tables exist and reference metadata aligns (C11, C16)"
      - "Confirm PII masking assertion (C16 + Law 151/2020): 0-phone assertion passes"
      - "Confirm cleaning fixes applied (C07 range, C09 de-dup 2196 rows, C12 dst tag, C16 special buildings)"
    decision_actions:
      - "amber: run targeted audit on failing dimension; produce data quality report (`reports/data_quality_report.xlsx`)"
      - "red: halt dashboard loading; fix failing dimension before user sees data"
