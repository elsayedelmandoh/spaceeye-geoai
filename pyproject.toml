[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spaceeye-geoai"
version = "0.1.0"
description = "رادار العاصمة الجديدة: شركة تمتلك مدينة. SpaceEye: R7 inspection priority observatory (New Administrative Capital) with a Streamlit dashboard and a hybrid RAG chatbot. Which compounds should the inspection committee visit first, and why."
readme = "README.md"
license = {text = "MIT"}
keywords = ["smart city", "New Administrative Capital", "dynamic world", "sentinel-2", "inspection priority", "digital twin", "streamlit dashboard", "RAG chatbot"]
authors = [
    {name = "elsayed elmandoh", email = "elsayedelmandoh7@gmail.com"},
    {name = "verina fouad"},
    {name = "ahmed abdelhamid"},
    {name = "nada shady"},
    {name = "salma magdy"},
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pyyaml>=6.0.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "duckdb",
    "pandas",
    "pyarrow",
    "openpyxl",
    "pandera",
    "scikit-learn",
    "shapely",
    "lightgbm",
    "matplotlib",
    "streamlit",
    "plotly",
    "google-genai",
    "sqlglot",
]

[project.optional-dependencies]
imagery = [
    "rasterio==1.5.2",
    "pillow>=11",
]
torch = [
    "torch>=2.6.0",
    "accelerate>=1.5.0",
]
pulls = [
    "earthengine-api",
]
chatbot = [
    "chromadb",
    "sentence-transformers",
]

# installed by plain `uv sync` (optional extras are not)
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "nbstripout>=0.8.0",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/"]

[project.urls]
repository = "https://github.com/elsayedelmandoh/spaceeye-geoai"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
