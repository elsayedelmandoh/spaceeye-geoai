<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finishing check - labelling</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #1b1b1f; color: #eee; }
  header, footer, section.controls { padding: 8px 16px; }
  header { display: flex; justify-content: space-between; align-items: center; background: #26262c; }
  h1 { font-size: 1.1rem; margin: 0; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px 16px; }
  .pair figure { margin: 0; text-align: center; }
  .pair img { width: 100%; max-height: 60vh; object-fit: contain; cursor: zoom-in; background: #000; }
  .controls { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
  button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 2px solid #666; background: #33333a; color: #eee; cursor: pointer; }
  button:focus-visible, textarea:focus-visible { outline: 3px solid #6cf; }
  button[aria-pressed="true"] { background: #2d6cdf; border-color: #9cf; }
  .labels button { display: block; margin-bottom: 6px; text-align: left; min-width: 22rem; }
  textarea { width: 24rem; height: 4rem; font: inherit; }
  #zoom { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.92); overflow: auto; z-index: 9; }
  #zoom.open { display: block; }
  #zoom img { display: block; margin: 0 auto; max-width: 100%; cursor: zoom-in; }
  #zoom img.full { max-width: none; cursor: zoom-out; }
  #status { color: #fc6; margin: 8px 16px; }
</style>
</head>
<body>
<header>
  <h1 id="title">Loading...</h1>
  <div><span id="progress" aria-live="polite"></span> <button type="button" id="export">Export CSV</button></div>
</header>
<p id="status" role="alert"></p>
<main id="main" hidden>
  <div class="pair">
    <figure><img id="imgL" alt="Earlier image of the pair (click to enlarge)"><figcaption id="capL"></figcaption></figure>
    <figure><img id="imgR" alt="Later image of the pair (click to enlarge)"><figcaption id="capR"></figcaption></figure>
  </div>
  <section class="controls">
    <div class="labels" role="group" aria-label="Label">
      <button type="button" data-label="A" aria-pressed="false">A - New structure / vertical progress</button>
      <button type="button" data-label="B" aria-pressed="false">B - Finishing only (no new structure)</button>
      <button type="button" data-label="C" aria-pressed="false">C - No visible change</button>
      <button type="button" data-label="U" aria-pressed="false">U - Cannot judge (cloud, missing, unclear)</button>
    </div>
    <div role="group" aria-label="Confidence">
      <button type="button" data-conf="high" aria-pressed="false">High confidence (h)</button>
      <button type="button" data-conf="low" aria-pressed="false">Low confidence (l)</button>
    </div>
    <div>
      <label for="note">Note (optional)</label><br>
      <textarea id="note"></textarea>
    </div>
    <div>
      <button type="button" id="prev">&larr; Previous</button>
      <button type="button" id="next">Next &rarr;</button>
    </div>
  </section>
  <footer>Keys: a/b/c/u label, h/l confidence, left/right arrows previous/next, click an image to enlarge, Esc closes.</footer>
</main>
<div id="zoom" role="dialog" aria-label="Enlarged image"><img id="zoomImg" alt="Enlarged image"></div>
<script src="manifest.js" onerror="document.getElementById('status').textContent='manifest.js not found: run make_manifest.py first.'"></script>
<script>
(function () {
  "use strict";
  var STORE = "finishing_labels_v1", POS = "finishing_pos_v1";
  var $ = function (id) { return document.getElementById(id); };
  if (!window.KIT) return;
  var items = [];
  window.KIT.areas.forEach(function (a) {
    for (var i = 0; i + 1 < a.images.length; i++)
      items.push({ area: a.id, k: i + 1, left: "images/" + a.images[i], right: "images/" + a.images[i + 1] });
  });
  if (!items.length) { $("status").textContent = "No intervals in manifest.js."; return; }
  var labels = {};
  try { labels = JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { labels = {}; }
  var pos = Math.max(0, Math.min(parseInt(localStorage.getItem(POS), 10) || 0, items.length - 1));
  var key = function (it) { return it.area + "|" + it.k + "->" + (it.k + 1); };
  var blank = { label: "", confidence: "", note: "" };
  var cur = function () { return labels[key(items[pos])] || blank; };
  var complete = function (it) { var v = labels[key(it)]; return !!(v && v.label && v.confidence); };

  function persist(patch) {
    labels[key(items[pos])] = Object.assign({}, cur(), patch);
    localStorage.setItem(STORE, JSON.stringify(labels));
  }
  function render() {
    var it = items[pos], e = cur();
    $("title").textContent = "Area " + it.area + " - interval " + it.k + "->" + (it.k + 1);
    $("progress").textContent = "Interval " + (pos + 1) + " of " + items.length +
      " | complete: " + items.filter(complete).length;
    $("imgL").src = it.left; $("imgR").src = it.right;
    $("capL").textContent = "Image " + it.k + " (earlier): " + it.left;
    $("capR").textContent = "Image " + (it.k + 1) + " (later): " + it.right;
    document.querySelectorAll("[data-label]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.label === e.label)); });
    document.querySelectorAll("[data-conf]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.conf === e.confidence)); });
    $("note").value = e.note;
    localStorage.setItem(POS, String(pos));
  }
  function save(patch) { persist(patch); render(); }
  function go(d) { var n = pos + d; if (n >= 0 && n < items.length) { pos = n; render(); } }
  function csvCell(s) { s = String(s); return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
  function exportCsv() {
    var missing = items.filter(function (x) { return !complete(x); }).length;
    if (missing && !confirm(missing + " interval(s) are not complete. Export anyway?")) return;
    var rows = ["id,interval,label,confidence,note"];
    items.forEach(function (it) {
      var e = labels[key(it)] || blank;
      rows.push([it.area, it.k + "->" + (it.k + 1), e.label, e.confidence, e.note].map(csvCell).join(","));
    });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([rows.join("\r\n") + "\r\n"], { type: "text/csv" }));
    a.download = "labels_salma.csv";
    a.click();
  }
  function openZoom(src) { $("zoomImg").src = src; $("zoomImg").className = ""; $("zoom").className = "open"; }

  document.querySelectorAll("[data-label]").forEach(function (b) { b.onclick = function () { save({ label: b.dataset.label }); }; });
  document.querySelectorAll("[data-conf]").forEach(function (b) { b.onclick = function () { save({ confidence: b.dataset.conf }); }; });
  $("note").oninput = function () { persist({ note: $("note").value }); };
  $("prev").onclick = function () { go(-1); };
  $("next").onclick = function () { go(1); };
  $("export").onclick = exportCsv;
  $("imgL").onclick = function () { openZoom(this.src); };
  $("imgR").onclick = function () { openZoom(this.src); };
  $("zoomImg").onclick = function (ev) { ev.stopPropagation(); this.classList.toggle("full"); };
  $("zoom").onclick = function () { this.className = ""; };
  document.addEventListener("keydown", function (ev) {
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
    if (ev.key === "Escape") { $("zoom").className = ""; return; }
    if (ev.target.tagName === "TEXTAREA") return;
    var k = ev.key.toLowerCase();
    if (k === "a" || k === "b" || k === "c" || k === "u") save({ label: k.toUpperCase() });
    else if (k === "h") save({ confidence: "high" });
    else if (k === "l") save({ confidence: "low" });
    else if (k === "arrowleft") go(-1);
    else if (k === "arrowright") go(1);
    else return;
    ev.preventDefault();
  });
  $("main").hidden = false;
  render();
})();
</script>
</body>
</html>
