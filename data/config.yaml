# Oasis District synthetic data kit — configuration
# حي الواحة (افتراضي) — بيانات اصطناعية لأغراض التدريب فقط
# Synthetic data — for training only. Fictional district. Not real operational data.

seed: 20250513            # change this and every dataset changes; keep it to reproduce
timezone: Africa/Cairo
label_en: "Synthetic data — for training only"
label_ar: "بيانات اصطناعية لأغراض التدريب فقط"

editions:
  lite:
    start: 2025-03-01
    end: 2025-06-30        # inclusive
    format: csv
    meter_buildings: 80    # subset of buildings with hourly electricity/water meters
    max_size_mb: 100
  full:                    # Phase 2 — not built yet
    start: 2025-01-01
    end: 2025-12-31
    format: parquet
    meter_buildings: 320
    max_size_mb: 500

district:
  population_start: 60000          # on 2025-01-01
  growth_per_month: 0.02           # the district is still filling
  weekend_days: [Friday, Saturday]
  zones:
    - {zone_id: Z01, name_en: Residential North, name_ar: سكني شمال,          zone_type: residential, population_start: 18000}
    - {zone_id: Z02, name_en: Residential South, name_ar: سكني جنوب,          zone_type: residential, population_start: 16000}
    - {zone_id: Z03, name_en: Government Quarter, name_ar: الحي الحكومي,       zone_type: government,  population_start: 2000}
    - {zone_id: Z04, name_en: Business District, name_ar: حي الأعمال,          zone_type: business,    population_start: 6000}
    - {zone_id: Z05, name_en: Mixed-Use,         name_ar: متعدد الاستخدامات,   zone_type: mixed_use,   population_start: 14000}
    - {zone_id: Z06, name_en: Green Park,        name_ar: المتنزه الأخضر,      zone_type: green_park,  population_start: 4000}
  # Fictional coordinates: a local grid placed in open desert. They do not describe any real place.
  origin_lat: 29.9500
  origin_lon: 32.0500

counts:
  traffic_sensors: 40
  parking_lots: 12
  pressure_points: 20
  water_quality_stations: 6
  bins: 150
  cameras: 60
  bms_buildings: 25
  air_quality_stations: 8
  noise_points: 10
  streetlights: 400
  trucks: 8

# Calendar events (date-computed holidays come from the Hijri calendar; see generator/calendar.py)
events:
  dust_storms:              # khamaseen; H5 is the big one
    - {date: 2025-03-20, intensity: 0.35}
    - {date: 2025-04-09, intensity: 1.00, story: H5}
    - {date: 2025-04-10, intensity: 0.80, story: H5}
    - {date: 2025-05-04, intensity: 0.40}
    - {date: 2025-05-05, intensity: 0.25}
  school_year_end: 2025-06-12
  school_year_start: 2025-09-21

stories:
  H1: {date: 2025-05-13, time: "06:40", zone: Z02, sensor: PRS-07, normal_bar: 4.2, low_bar: 2.1, resolved: "09:30"}
  H3: {sensor: TRF-017, start: 2025-03-01, drift_per_week: 0.01}
  H5: {dates: [2025-04-09, 2025-04-10]}
  H6: {date: 2025-06-15, uplift: 1.812, ramp_days: 3}   # calibrated: last 14 days vs same 14 days of May = +85%
  H7: {note: "Ramadan 1446 computed from the Hijri calendar (2025-03-01 to 2025-03-29)"}
  H8: {zone: Z05, start: 2025-04-24, end: 2025-04-26, outage_uptime: 75.0}
  H2: {phase: 2, note: "mid-July heatwave — full edition"}
  H4: {phase: 2, note: "Z04 waste schedule from 2025-09-01 — full edition"}

defects:
  DQ1_missing_rate: [0.01, 0.03]
  DQ2_traffic_sensors: [TRF-005, TRF-012, TRF-029, TRF-036]
  DQ2_pressure_sensors: [PRS-03, PRS-15]
  DQ3_duplicate_rate: 0.005
  DQ5_spike_rate: 0.001
  DQ6_stuck:
    - {sensor: AQ-03, start: "2025-03-17 09:00", end: "2025-03-20 15:00"}
    - {sensor: AQ-06, start: "2025-05-25 22:00", end: "2025-05-28 08:00"}
  DQ6b_stuck_traffic:       # extra, for the Day 1 dashboard "stuck sensor"
    - {sensor: TRF-023, start: "2025-06-10 05:00", end: "2025-06-10 16:00"}
  DQ7_wh_buildings: 3
  DQ7_fahrenheit_bms: 1
  DQ8_rate: 0.10
  DQ9_rate: 0.05
  DQ10_orphan_sensor: TRF-041
  DQ11_late_rate: 0.02
  DQ12: {sensor: TRF-017, start: 2025-03-01, per_week: 0.01}
